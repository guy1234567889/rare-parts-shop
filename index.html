<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>החוליה החסרה - החלקים הקטנים שאין באף מקום</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 0; text-align: center; }
        header { background: #2c3e50; color: white; padding: 2rem; }
        .hero { padding: 3rem 1rem; }
        .search-box { padding: 15px; width: 60%; max-width: 500px; font-size: 18px; border: 2px solid #ccc; border-radius: 8px; }
        .products { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 2rem; }
        .card { background: white; padding: 20px; border-radius: 8px; width: 250px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { background: #27ae60; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 10px; }
        .nav-links { margin: 20px; }
        .nav-links a { margin: 0 15px; color: #2c3e50; text-decoration: none; font-weight: bold; }
        footer { background: #2c3e50; color: white; padding: 1.5rem; margin-top: 3rem; }
    </style>
</head>
<body>

    <header>
        <h1>החוליה החסרה</h1>
        <p>מוצרים קטנים וייחודיים שאי אפשר למצוא בישראל – זמינים במלאי</p>
    </header>

    <div class="nav-links">
        <a href="request.html">🔍 לא מצאת? נחפש בשבילך</a>
        <a href="terms.html">📄 תקנון ותנאי שימוש</a>
    </div>

    <div class="hero">
        <h2>מה חסר לך היום?</h2>
        <input type="text" class="search-box" placeholder="חפש מתאם, כבל, קליפס...">
    </div>

    <section class="products">
        <div class="card">
            <h3>מתאם למקבוק</h3>
            <p>מתאם מקורי למטען אפל (Duckhead)</p>
            <p><strong>₪35</strong></p>
            <a href="#" class="btn">לרכישה מהירה</a>
        </div>
        <div class="card">
            <h3>פקקי אבק ללפטופ</h3>
            <p>סט הגנה מלא לחיבורי USB-C</p>
            <p><strong>₪20</strong></p>
            <a href="#" class="btn">לרכישה מהירה</a>
        </div>
    </section>

    <footer>
        <p>© כל הזכויות שמורות - החוליה החסרה</p>
    </footer>

</body>
</html>
