<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לא מצאת? נחפש בשבילך - החוליה החסרה</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 2rem; line-height: 1.6; text-align: right; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn { background: #27ae60; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 18px; }
        .btn:hover { background: #219653; }
        .back-link { text-align: center; margin-top: 20px; }
        a { color: #27ae60; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>לא מצאת את מה שחיפשת?</h1>
        <p style="text-align: center;">ספר לנו איזה חלק, מתאם או רכיב חסר לך בישראל, ונמצא אותו עבורך!</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">שם מלא:</label>
                <input type="text" id="name" name="name" required placeholder="השם שלך">
            </div>
            
            <div class="form-group">
                <label for="phone">טלפון ליצירת קשר:</label>
                <input type="tel" id="phone" name="phone" required placeholder="מספר הנייד שלך">
            </div>

            <div class="form-group">
                <label for="product">תיאור המוצר או החלק החסר:</label>
                <textarea id="product" name="product" rows="4" required placeholder="לדוגמה: מתאם מטען ללפטופ דגם X, או קליפס פלסטיק לרכב..."></textarea>
            </div>

            <button type="submit" class="btn">שלח בקשת חיפוש</button>
        </form>

        <div class="back-link">
            <a href="index.html">← חזרה לעמוד הבית</a>
        </div>
    </div>
</body>
</html>
